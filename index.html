<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecuGen HU20 Fingerprint Scanner</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: system-ui, sans-serif;
            background: #0f1117;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 2rem 1rem;
            gap: 2rem;
        }

        header {
            text-align: center;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        header p {
            margin-top: 0.4rem;
            font-size: 0.875rem;
            color: #94a3b8;
        }

        /* Status pill */
        #status-bar {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.5rem 1.1rem;
            border-radius: 999px;
            background: #1e2330;
            border: 1px solid #2d3348;
            font-size: 0.85rem;
            font-weight: 500;
            transition: border-color 0.2s;
        }

        #status-bar.connected { border-color: #22c55e; }
        #status-bar.error     { border-color: #ef4444; }

        #status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4b5563;
            flex-shrink: 0;
            transition: background 0.2s;
        }

        #status-bar.connected #status-dot { background: #22c55e; }
        #status-bar.error     #status-dot { background: #ef4444; }

        /* Main card */
        .card {
            background: #1e2330;
            border: 1px solid #2d3348;
            border-radius: 16px;
            padding: 2rem;
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        /* Canvas */
        #canvas-wrap {
            position: relative;
            background: #0f1117;
            border-radius: 10px;
            border: 1px solid #2d3348;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 280px;
        }

        canvas {
            display: block;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
        }

        #canvas-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            color: #4b5563;
            font-size: 0.875rem;
            pointer-events: none;
        }

        #canvas-placeholder svg {
            opacity: 0.4;
        }

        #canvas-placeholder.hidden { display: none; }

        /* Buttons */
        .btn-row {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            padding: 0.65rem 1rem;
            border-radius: 8px;
            border: 1px solid transparent;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s, opacity 0.15s;
            white-space: nowrap;
        }

        button:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .btn-primary {
            background: #3b82f6;
            color: #fff;
            border-color: #2563eb;
        }
        .btn-primary:not(:disabled):hover { background: #2563eb; }

        .btn-secondary {
            background: #2d3348;
            color: #e2e8f0;
            border-color: #3d4460;
        }
        .btn-secondary:not(:disabled):hover { background: #3d4460; }

        .btn-danger {
            background: transparent;
            color: #f87171;
            border-color: #3d4460;
        }
        .btn-danger:not(:disabled):hover { background: #2d3348; }

        /* LED row */
        .led-row {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .led-row span {
            font-size: 0.8rem;
            color: #64748b;
            flex-shrink: 0;
        }

        /* Log */
        details summary {
            cursor: pointer;
            font-size: 0.8rem;
            color: #64748b;
            user-select: none;
            padding: 0.25rem 0;
        }

        details summary:hover { color: #94a3b8; }

        #log {
            margin-top: 0.75rem;
            background: #0f1117;
            border-radius: 8px;
            padding: 0.75rem;
            font-size: 0.75rem;
            font-family: monospace;
            color: #94a3b8;
            max-height: 180px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .log-info  { color: #94a3b8; }
        .log-ok    { color: #22c55e; }
        .log-warn  { color: #f59e0b; }
        .log-error { color: #f87171; }

        /* Download link */
        #download-link {
            display: none;
            text-align: center;
            font-size: 0.8rem;
            color: #3b82f6;
            text-decoration: none;
        }
        #download-link:hover { text-decoration: underline; }

        /* WebUSB warning */
        #compat-warning {
            display: none;
            background: #3d2a00;
            border: 1px solid #b45309;
            border-radius: 10px;
            padding: 1rem 1.2rem;
            font-size: 0.83rem;
            color: #fcd34d;
            max-width: 480px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<header>
    <h1>SecuGen HU20 Fingerprint Scanner</h1>
    <p>WebUSB — no SDK or local software required</p>
</header>

<div id="compat-warning">
    <strong>Browser not supported.</strong> WebUSB requires Chrome or Edge 89+.
    Firefox and Safari do not support WebUSB.
</div>

<div id="status-bar">
    <span id="status-dot"></span>
    <span id="status-text">Not connected</span>
</div>

<div class="card">

    <div id="canvas-wrap">
        <canvas id="fingerprint" width="300" height="400"></canvas>
        <div id="canvas-placeholder">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
                <path d="M12 11c0-1.1.9-2 2-2s2 .9 2 2v1"/>
                <path d="M5 12a7 7 0 0 1 14 0"/>
                <path d="M5 12v1a7 7 0 0 0 7 7"/>
                <path d="M15 19a4 4 0 0 0 4-4v-3"/>
                <path d="M9 19a4 4 0 0 1-3-3.87"/>
                <path d="M12 12v5"/>
            </svg>
            <span>Place finger on scanner</span>
        </div>
    </div>

    <a id="download-link" download="fingerprint.png">Download image</a>

    <div class="btn-row">
        <button id="btn-connect"       class="btn-primary">Connect Scanner</button>
        <button id="btn-force-connect" class="btn-secondary" title="Issues a USB reset to force any other application to release the device, then connects.">Force Connect</button>
        <button id="btn-scan"          class="btn-primary" disabled>Capture</button>
        <button id="btn-disconnect"    class="btn-danger" disabled>Disconnect</button>
    </div>

    <div class="led-row">
        <span>LED</span>
        <button id="btn-led-on"  class="btn-secondary" disabled>On</button>
        <button id="btn-led-off" class="btn-secondary" disabled>Off</button>
    </div>

    <details>
        <summary>Debug log</summary>
        <div id="log"></div>
    </details>

</div>

<script type="module">
    import { SecuGenScanner } from './src/secugen.js';

    const scanner = new SecuGenScanner();

    const canvas      = document.getElementById('fingerprint');
    const placeholder = document.getElementById('canvas-placeholder');
    const statusBar   = document.getElementById('status-bar');
    const statusText  = document.getElementById('status-text');
    const btnConnect       = document.getElementById('btn-connect');
    const btnForceConnect  = document.getElementById('btn-force-connect');
    const btnScan          = document.getElementById('btn-scan');
    const btnDisconnect    = document.getElementById('btn-disconnect');
    const btnLedOn    = document.getElementById('btn-led-on');
    const btnLedOff   = document.getElementById('btn-led-off');
    const downloadLink = document.getElementById('download-link');
    const logEl       = document.getElementById('log');
    const compatWarn  = document.getElementById('compat-warning');

    // ---- WebUSB compatibility check ----
    if (!navigator.usb) {
        compatWarn.style.display = 'block';
        btnConnect.disabled = true;
        log('WebUSB not available in this browser.', 'error');
    }

    // ---- Logging ----
    function log(msg, level = 'info') {
        const el = document.createElement('div');
        el.className = `log-${level}`;
        el.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
        logEl.appendChild(el);
        logEl.scrollTop = logEl.scrollHeight;
    }

    // ---- UI state ----
    function setConnected(connected) {
        statusBar.className = connected ? 'connected' : '';
        statusText.textContent = connected
            ? `Connected — ${scanner.deviceName ?? 'SecuGen scanner'}`
            : 'Not connected';
        btnConnect.disabled       = connected;
        btnForceConnect.disabled  = connected;
        btnScan.disabled          = !connected;
        btnDisconnect.disabled    = !connected;
        btnLedOn.disabled         = !connected;
        btnLedOff.disabled        = !connected;
    }

    function setError(msg) {
        statusBar.className = 'error';
        statusText.textContent = msg;
    }

    function showImage(imageData) {
        const ctx = canvas.getContext('2d');
        ctx.putImageData(imageData, 0, 0);
        placeholder.classList.add('hidden');

        // Update download link
        const dataUrl = canvas.toDataURL('image/png');
        downloadLink.href = dataUrl;
        downloadLink.style.display = 'block';
    }

    // ---- Scanner events ----
    scanner.addEventListener('log', e => log(e.detail));

    scanner.addEventListener('connect', () => {
        log(`Connected to ${scanner.deviceName ?? 'device'}`, 'ok');
        setConnected(true);
    });

    scanner.addEventListener('disconnect', () => {
        log('Disconnected', 'warn');
        setConnected(false);
    });

    // ---- Button handlers ----
    btnConnect.addEventListener('click', async () => {
        log('Requesting device…');
        btnConnect.disabled = true;
        btnForceConnect.disabled = true;
        try {
            await scanner.requestConnect();
        } catch (err) {
            log(`Connection failed: ${err.message}`, 'error');
            setError('Connection failed');
            btnConnect.disabled = false;
            btnForceConnect.disabled = false;
        }
    });

    btnForceConnect.addEventListener('click', async () => {
        log('Force connect: requesting device…');
        btnConnect.disabled = true;
        btnForceConnect.disabled = true;
        try {
            await scanner.forceConnect();
        } catch (err) {
            log(`Force connect failed: ${err.message}`, 'error');
            setError('Force connect failed');
            btnConnect.disabled = false;
            btnForceConnect.disabled = false;
        }
    });

    btnDisconnect.addEventListener('click', async () => {
        await scanner.disconnect();
    });

    btnScan.addEventListener('click', async () => {
        btnScan.disabled = true;
        placeholder.classList.remove('hidden');
        downloadLink.style.display = 'none';
        log('Starting capture sequence…');
        try {
            const imageData = await scanner.capture();
            showImage(imageData);
            log('Capture complete', 'ok');
        } catch (err) {
            log(`Capture failed: ${err.message}`, 'error');
            setError(`Capture error: ${err.message}`);
        } finally {
            btnScan.disabled = false;
        }
    });

    btnLedOn.addEventListener('click', async () => {
        try {
            await scanner.setLED(true);
            log('LED on', 'ok');
        } catch (err) {
            log(`LED error: ${err.message}`, 'error');
        }
    });

    btnLedOff.addEventListener('click', async () => {
        try {
            await scanner.setLED(false);
            log('LED off', 'ok');
        } catch (err) {
            log(`LED error: ${err.message}`, 'error');
        }
    });

    // ---- Auto-connect on load (previously paired device) ----
    if (navigator.usb) {
        log('Checking for previously paired device…');
        scanner.autoConnect().then(found => {
            if (!found) log('No paired device found. Click "Connect Scanner".');
        });
    }
</script>

</body>
</html>
